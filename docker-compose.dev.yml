services:
  snippet-db:
    image: postgres:16
    container_name: snippet-db
    environment:
      POSTGRES_USER: ${SNIPPET_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPET_DB_PASSWORD}
      POSTGRES_DB: ${SNIPPET_DB_NAME}
    ports:
      - "5440:5432"
    volumes:
      - snippet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  snippet-service:
    build: ../snippet-service
    container_name: snippet-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://snippet-db:5432/${SNIPPET_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SNIPPET_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SNIPPET_DB_PASSWORD}
    ports:
      - "8082:8080"
    depends_on:
      snippet-db:
        condition: service_healthy
    restart: unless-stopped

  permission-db:
    image: postgres:16
    container_name: permission-db
    environment:
      POSTGRES_USER: ${PERMISSION_DB_USER}
      POSTGRES_PASSWORD: ${PERMISSION_DB_PASSWORD}
      POSTGRES_DB: ${PERMISSION_DB_NAME}
    ports:
      - "5441:5432"
    volumes:
      - permission-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  permission-service:
    build: ../permission-service
    container_name: permission-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://permission-db:5432/${PERMISSION_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PERMISSION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PERMISSION_DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      permission-db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  snippet-db-data:
  permission-db-data:

