name: CD Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a vm-dev
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VM_HOST_DEV }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          envs: GHCR_USERNAME,GHCR_PAT
          script: |
            set -e
            cd ~/infra
            git pull --ff-only origin dev
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            set -a; . ./.env; set +a
            docker stack deploy --with-registry-auth -c docker-stack.yml snippet
            docker service update --force --detach snippet_nginx